<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; font-family: 'Segoe UI', Roboto, Arial, sans-serif; overflow: hidden; }
  .page { position: absolute; inset: 0; background: linear-gradient(160deg, #1a0505 0%, #0a0a0b 60%); }
  .browser-bar { height: 64px; background: #1f1f21; border-bottom: 1px solid #2a2a2c; display: flex; align-items: center; gap: 14px; padding: 0 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot--r { background: #ff5f57; } .dot--y { background: #febc2e; } .dot--g { background: #28c840; }
  .url-pill { flex: 1; max-width: 640px; height: 34px; margin-left: 30px; background: #2b2b2e; border-radius: 17px; display: flex; align-items: center; padding: 0 16px; gap: 8px; color: #9aa0a6; font-size: 13px; }
  .lock { width: 12px; height: 12px; fill: #9aa0a6; }
  .content { display: flex; align-items: center; justify-content: center; height: calc(800px - 64px); }
  .player-inner { width: 1000px; height: 560px; border-radius: 6px; background: linear-gradient(135deg, #3d0d0d 0%, #14060a 100%); position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px #222; }
  .play-glyph { width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; }
  .play-glyph svg { width: 36px; height: 36px; fill: #fff; margin-left: 4px; }
  .video-title { position: absolute; top: 596px; left: 140px; color: #e8eaed; font-size: 22px; font-weight: 700; width: 900px; }

  :root { --bg:#202124; --card:#2d2f33; --accent:#4285f4; --text-primary:#fff; --text-secondary:#9aa0a6; --border:#3c4043; --danger:#f28b82; --radius-lg:16px; --radius-md:12px; --radius-sm:8px; }
  .popup-wrap { position: absolute; top: 54px; right: 60px; box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px #000; border-radius: 16px; }
  .popup-body { width: 320px; background: var(--bg); color: var(--text-primary); font-size: 14px; border-radius: 16px; overflow: hidden; }
  .app { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .app__header { display: flex; align-items: center; justify-content: space-between; }
  .app__brand { display: flex; align-items: center; gap: 8px; }
  .app__title { margin: 0; font-size: 16px; font-weight: 600; }
  .app__version { font-size: 11px; color: var(--text-secondary); }
  .icon--brand { width: 24px; height: 24px; color: var(--accent); display: inline-flex; }
  .icon--brand svg { width: 100%; height: 100%; fill: currentColor; }
  .card { background: var(--card); border-radius: var(--radius-lg); padding: 12px 14px; }
  .site-card { display: flex; align-items: center; gap: 10px; }
  .site-card__favicon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: #e50914; flex-shrink: 0; }
  .site-card__info { min-width: 0; flex: 1; }
  .site-card__title { margin: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-card__domain { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
  .volume-card__row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .volume-card__label { font-size: 13px; color: var(--text-secondary); }
  .volume-card__value { font-size: 20px; font-weight: 700; color: var(--danger); }
  .slider-track { width: 100%; height: 6px; border-radius: 999px; background: linear-gradient(to right, var(--danger) 0%, var(--danger) 50%, var(--border) 50%); position: relative; }
  .slider-thumb { position: absolute; top: -6px; left: calc(50% - 9px); width: 18px; height: 18px; border-radius: 50%; background: var(--danger); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .volume-card__scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text-secondary); }
  .actions { display: flex; gap: 10px; }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13px; font-weight: 600; color: var(--text-primary); background: var(--card); }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }
  .btn--muted { background: rgba(242,139,130,0.15); border-color: var(--danger); color: var(--danger); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .switch__track { position: absolute; inset: 0; background: var(--accent); border-radius: 999px; }
  .switch__thumb { position: absolute; top: 2px; left: 18px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .app__footer { min-height: 14px; text-align: center; }
  .app__status { font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="page">
    <div class="browser-bar">
      <div class="dot dot--r"></div><div class="dot dot--y"></div><div class="dot dot--g"></div>
      <div class="url-pill">
        <svg class="lock" viewBox="0 0 24 24"><path d="M12 17a2 2 0 002-2 2 2 0 00-2-2 2 2 0 00-2 2 2 2 0 002 2zm6-9h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
        www.netflix.com/watch/super-volume-demo
      </div>
    </div>
    <div class="content">
      <div class="player-inner">
        <div class="play-glyph"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="video-title">Silenciado con un clic — sin tocar el volumen del sistema</div>
    </div>
  </div>

  <div class="popup-wrap">
    <div class="popup-body">
      <div class="app">
        <header class="app__header">
          <div class="app__brand">
            <span class="icon--brand"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.99-3.29-2.5-4.03v8.05c1.51-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
            <h1 class="app__title">Super Volume</h1>
          </div>
          <span class="app__version">v1.0.0</span>
        </header>

        <section class="card site-card">
          <span class="site-card__favicon"></span>
          <div class="site-card__info">
            <p class="site-card__title">Serie — Temporada 2, Episodio 4</p>
            <p class="site-card__domain">netflix.com</p>
          </div>
        </section>

        <section class="card volume-card">
          <div class="volume-card__row">
            <span class="volume-card__label">Volumen</span>
            <span class="volume-card__value">Muted</span>
          </div>
          <div class="slider-track"><div class="slider-thumb"></div></div>
          <div class="volume-card__scale"><span>0%</span><span>100%</span><span>300%</span><span>600%</span></div>
        </section>

        <section class="actions">
          <button class="btn">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 2.97-2.16 5.44-5 5.92v2.02c3.95-.49 7-3.85 7-7.94 0-4.42-3.58-8-8-8zm-6 8c0-1.65.67-3.15 1.76-4.24L6.34 7.34C4.9 8.79 4 10.79 4 13c0 4.08 3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91z"/></svg>
            Reset
          </button>
          <button class="btn btn--muted">
            <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            Unmute
          </button>
        </section>

        <section class="card">
          <label class="switch-row">
            <span>Recordar volumen por sitio</span>
            <span class="switch"><span class="switch__track"><span class="switch__thumb"></span></span></span>
          </label>
        </section>

        <footer class="app__footer">
          <span class="app__status">Silenciado</span>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
