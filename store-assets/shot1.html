<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 1280px; height: 800px;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  /* ── Fondo: mockup de página de video ─────────────────────────── */
  .page {
    position: absolute; inset: 0;
    background: radial-gradient(1200px 800px at 30% 0%, #1b1b1f 0%, #0f0f10 55%, #0a0a0b 100%);
  }
  .browser-bar {
    height: 64px;
    background: #1f1f21;
    border-bottom: 1px solid #2a2a2c;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot--r { background: #ff5f57; } .dot--y { background: #febc2e; } .dot--g { background: #28c840; }
  .url-pill {
    flex: 1; max-width: 640px; height: 34px; margin-left: 30px;
    background: #2b2b2e; border-radius: 17px;
    display: flex; align-items: center; padding: 0 16px; gap: 8px;
    color: #9aa0a6; font-size: 13px;
  }
  .lock { width: 12px; height: 12px; fill: #9aa0a6; }
  .content {
    display: flex; height: calc(800px - 64px);
  }
  .player {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .player-inner {
    width: 860px; height: 484px; border-radius: 6px;
    background: linear-gradient(135deg, #1a2c4d 0%, #0d1b33 100%);
    position: relative; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px #222;
  }
  .play-glyph {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .play-glyph svg { width: 34px; height: 34px; fill: #fff; margin-left: 4px; }
  .video-title {
    position: absolute; top: 522px; left: calc(50% - 430px);
    color: #e8eaed; font-size: 20px; font-weight: 600; width: 700px;
  }
  .video-sub {
    position: absolute; top: 556px; left: calc(50% - 430px);
    color: #9aa0a6; font-size: 13px;
  }
  .sidebar { width: 340px; background: #131314; padding: 16px; }
  .thumb { display:flex; gap:10px; margin-bottom:16px; }
  .thumb-box { width: 130px; height: 74px; border-radius: 8px; background: #26262a; flex-shrink:0; }
  .thumb-lines div { height: 8px; background: #2a2a2e; border-radius: 4px; margin-bottom: 6px; }
  .thumb-lines div:nth-child(1){ width: 150px; }
  .thumb-lines div:nth-child(2){ width: 100px; }

  /* ── Extensiones toolbar icon ─────────────────────────────────── */
  .ext-anchor {
    position: absolute; top: 14px; right: 96px;
    width: 34px; height: 34px; border-radius: 8px;
    background: #34363b;
    display: flex; align-items: center; justify-content: center;
  }
  .ext-anchor svg { width: 18px; height: 18px; fill: #8ab4f8; }
  .ext-badge {
    position: absolute; top: 8px; right: 90px;
    background: #4285f4; color: #fff; font-size: 9px; font-weight: 700;
    padding: 1px 4px; border-radius: 4px; line-height: 1.3;
  }

  /* ── Popup real (copiado 1:1 de popup.css) ────────────────────── */
  :root {
    --bg: #202124; --card: #2d2f33; --card-hover: #34363b;
    --accent: #4285f4; --accent-hover: #5b95f5; --accent-active: #3367d6;
    --text-primary: #ffffff; --text-secondary: #9aa0a6; --border: #3c4043;
    --danger: #f28b82; --radius-lg: 16px; --radius-md: 12px; --radius-sm: 8px;
  }
  .popup-wrap {
    position: absolute; top: 54px; right: 60px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px #000;
    border-radius: 16px;
  }
  .popup-body {
    width: 320px; background: var(--bg); color: var(--text-primary);
    font-size: 14px; border-radius: 16px; overflow: hidden;
  }
  .app { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .app__header { display: flex; align-items: center; justify-content: space-between; }
  .app__brand { display: flex; align-items: center; gap: 8px; }
  .app__title { margin: 0; font-size: 16px; font-weight: 600; }
  .app__version { font-size: 11px; color: var(--text-secondary); }
  .icon--brand { width: 24px; height: 24px; color: var(--accent); display: inline-flex; }
  .icon--brand svg { width: 100%; height: 100%; fill: currentColor; }
  .card { background: var(--card); border-radius: var(--radius-lg); padding: 12px 14px; }
  .site-card { display: flex; align-items: center; gap: 10px; }
  .site-card__favicon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: #ff0000; flex-shrink: 0; }
  .site-card__info { min-width: 0; flex: 1; }
  .site-card__title { margin: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-card__domain { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
  .volume-card__row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .volume-card__label { font-size: 13px; color: var(--text-secondary); }
  .volume-card__value { font-size: 20px; font-weight: 700; color: #fbbc04; }
  .slider-track {
    width: 100%; height: 6px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) 41.6%, var(--border) 41.6%);
    position: relative;
  }
  .slider-thumb {
    position: absolute; top: -6px; left: calc(41.6% - 9px);
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .volume-card__scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text-secondary); }
  .actions { display: flex; gap: 10px; }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
    font-size: 13px; font-weight: 600; color: var(--text-primary); background: var(--card); }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .switch__track { position: absolute; inset: 0; background: var(--accent); border-radius: 999px; }
  .switch__thumb { position: absolute; top: 2px; left: 18px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .app__footer { min-height: 14px; text-align: center; }
  .app__status { font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="page">
    <div class="browser-bar">
      <div class="dot dot--r"></div><div class="dot dot--y"></div><div class="dot dot--g"></div>
      <div class="url-pill">
        <svg class="lock" viewBox="0 0 24 24"><path d="M12 17a2 2 0 002-2 2 2 0 00-2-2 2 2 0 00-2 2 2 2 0 002 2zm6-9h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
        www.youtube.com/watch?v=super-volume-demo
      </div>
    </div>
    <div class="ext-anchor">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.99-3.29-2.5-4.03v8.05c1.51-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>
    <div class="ext-badge">250%</div>
    <div class="content">
      <div class="player">
        <div class="player-inner">
          <div class="play-glyph"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        </div>
        <div class="video-title">Concierto en vivo — audio muy bajo, ahora al 250% con Super Volume</div>
        <div class="video-sub">1.2M vistas · hace 3 días</div>
      </div>
      <div class="sidebar">
        <div class="thumb"><div class="thumb-box"></div><div class="thumb-lines"><div></div><div></div></div></div>
        <div class="thumb"><div class="thumb-box"></div><div class="thumb-lines"><div></div><div></div></div></div>
        <div class="thumb"><div class="thumb-box"></div><div class="thumb-lines"><div></div><div></div></div></div>
        <div class="thumb"><div class="thumb-box"></div><div class="thumb-lines"><div></div><div></div></div></div>
      </div>
    </div>
  </div>

  <div class="popup-wrap">
    <div class="popup-body">
      <div class="app">
        <header class="app__header">
          <div class="app__brand">
            <span class="icon--brand">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.99-3.29-2.5-4.03v8.05c1.51-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </span>
            <h1 class="app__title">Super Volume</h1>
          </div>
          <span class="app__version">v1.0.0</span>
        </header>

        <section class="card site-card">
          <span class="site-card__favicon"></span>
          <div class="site-card__info">
            <p class="site-card__title">Concierto en vivo — Canal Oficial</p>
            <p class="site-card__domain">youtube.com</p>
          </div>
        </section>

        <section class="card volume-card">
          <div class="volume-card__row">
            <span class="volume-card__label">Volumen</span>
            <span class="volume-card__value">250%</span>
          </div>
          <div class="slider-track"><div class="slider-thumb"></div></div>
          <div class="volume-card__scale"><span>0%</span><span>100%</span><span>300%</span><span>600%</span></div>
        </section>

        <section class="actions">
          <button class="btn">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 2.97-2.16 5.44-5 5.92v2.02c3.95-.49 7-3.85 7-7.94 0-4.42-3.58-8-8-8zm-6 8c0-1.65.67-3.15 1.76-4.24L6.34 7.34C4.9 8.79 4 10.79 4 13c0 4.08 3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91z"/></svg>
            Reset
          </button>
          <button class="btn">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.99-3.29-2.5-4.03v8.05c1.51-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            Mute
          </button>
        </section>

        <section class="card">
          <label class="switch-row">
            <span>Recordar volumen por sitio</span>
            <span class="switch">
              <span class="switch__track"><span class="switch__thumb"></span></span>
            </span>
          </label>
        </section>

        <footer class="app__footer">
          <span class="app__status">Volumen guardado para youtube.com</span>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
